<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#10151f">
<meta name="description" content="Pocket OS — a personal web desktop for your phone or computer.">
<link rel="manifest" href="./manifest.webmanifest">
<title>Pocket OS</title>
<style>
:root{--bg:#0d111b;--panel:#151c29;--panel2:#1c2636;--line:#2c394d;--text:#f1f5fb;--muted:#9caec4;--accent:#7c9cff;--accent2:#62e6c5;--shadow:0 18px 60px #0008}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text);overflow:hidden}button,input,textarea,select{font:inherit}button{cursor:pointer;color:inherit;border:1px solid var(--line);background:var(--panel2);border-radius:10px;padding:9px 12px}button:hover{border-color:var(--accent)}button.primary{background:var(--accent);color:#101526;border-color:transparent;font-weight:700}button.ghost{background:transparent}.small{font-size:12px;color:var(--muted)}.muted{color:var(--muted)}.hidden{display:none!important}
#desktop{height:100%;position:relative;overflow:hidden;background:radial-gradient(ellipse at 15% 10%,#203454 0,transparent 38%),radial-gradient(ellipse at 88% 70%,#183c43 0,transparent 36%),linear-gradient(145deg,#0c111b,#111a29 60%,#101722)}
#topbar{position:absolute;z-index:1000;top:0;left:0;right:0;height:42px;display:flex;align-items:center;justify-content:space-between;padding:0 14px;background:#0b1018c9;border-bottom:1px solid #ffffff12;backdrop-filter:blur(18px);font-size:13px}
.brand{font-weight:800;letter-spacing:.2px;display:flex;gap:8px;align-items:center}.logo{width:23px;height:23px;border-radius:8px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:grid;place-items:center;color:#0b1321;font-weight:900}.topright{display:flex;gap:12px;align-items:center;color:#c9d5e5}
#icons{position:absolute;top:60px;left:18px;display:grid;grid-template-columns:repeat(1,86px);gap:12px}.desktop-icon{width:82px;min-height:78px;border:1px solid transparent;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;font-size:12px;text-align:center;padding:8px}.desktop-icon:hover{background:#ffffff12;border-color:#ffffff15}.emoji{font-size:26px;filter:drop-shadow(0 5px 8px #0005)}
#dock{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);display:flex;gap:7px;padding:8px;background:#111927bd;border:1px solid #ffffff20;border-radius:18px;backdrop-filter:blur(20px);box-shadow:var(--shadow);z-index:900;max-width:calc(100% - 18px);overflow-x:auto}
.dockbtn{width:48px;height:46px;border-radius:13px;padding:0;display:grid;place-items:center;font-size:23px;background:#ffffff09;border-color:transparent;flex:0 0 auto}.dockbtn:hover{background:#ffffff1c}.dockbtn.active{outline:2px solid var(--accent)}
#windows{position:absolute;inset:42px 0 76px;pointer-events:none}.window{pointer-events:auto;position:absolute;left:clamp(10px,13vw,190px);top:clamp(10px,8vh,65px);width:min(760px,calc(100vw - 24px));height:min(560px,calc(100% - 20px));min-width:280px;min-height:220px;background:#111925f5;border:1px solid #52627a80;border-radius:15px;box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column;backdrop-filter:blur(20px)}.window.maximized{left:8px!important;top:8px!important;width:calc(100% - 16px)!important;height:calc(100% - 16px)!important}.titlebar{height:44px;flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;padding:0 10px 0 14px;background:#202b3b;border-bottom:1px solid var(--line);cursor:grab;user-select:none}.titlebar:active{cursor:grabbing}.window-title{font-size:13px;font-weight:750;display:flex;align-items:center;gap:9px}.window-controls{display:flex;gap:5px}.window-controls button{width:28px;height:28px;padding:0;border-radius:8px;background:#ffffff08;border-color:transparent}.window-body{overflow:auto;flex:1;padding:16px}.window-body.no-pad{padding:0}.window-footer{padding:9px 14px;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}
h1,h2,h3,p{margin-top:0}h2{font-size:21px;margin-bottom:7px}h3{font-size:15px;margin-bottom:8px}.subhead{color:var(--muted);font-size:13px;margin-bottom:18px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}.tile{padding:15px;border:1px solid var(--line);background:linear-gradient(145deg,#1c2738,#141c29);border-radius:14px}.tile .big{font-size:28px;margin-bottom:10px}.tile strong{display:block;margin-bottom:5px}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.between{display:flex;justify-content:space-between;align-items:center;gap:10px}.field{width:100%;background:#0c121d;border:1px solid var(--line);color:var(--text);padding:10px 11px;border-radius:9px;outline:none}.field:focus{border-color:var(--accent)}label{font-size:12px;color:var(--muted);display:block;margin:10px 0 6px}.file-layout{display:grid;grid-template-columns:180px minmax(0,1fr);height:100%}.sidebar{border-right:1px solid var(--line);padding:12px;background:#0c121b}.sideitem{display:flex;width:100%;text-align:left;gap:9px;align-items:center;background:transparent;border-color:transparent;margin:3px 0}.sideitem.selected{background:#26354a;border-color:#3b4d68}.filemain{padding:15px;overflow:auto}.filegrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(115px,1fr));gap:8px;margin-top:15px}.fileitem{position:relative;min-height:96px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center;padding:10px 7px;background:#ffffff05;border:1px solid transparent;border-radius:10px;word-break:break-word;font-size:12px}.fileitem:hover,.fileitem.selected{background:#29374b;border-color:#536987}.fileitem .fileemoji{font-size:27px}.fileitem .check{position:absolute;top:5px;right:6px}.toolbar{display:flex;gap:7px;flex-wrap:wrap}.toolbar button{font-size:12px;padding:8px}.browserbar{display:flex;gap:7px;margin-bottom:13px}.browserbar input{flex:1;min-width:0}.browserhome{min-height:250px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;background:radial-gradient(ellipse,#24375066,transparent 65%);border-radius:14px}.browserhome .search{width:min(500px,100%);display:flex;gap:7px;margin-top:12px}.quicklinks{display:flex;justify-content:center;flex-wrap:wrap;gap:8px;margin-top:16px}.webnote{border:1px solid var(--line);border-radius:12px;padding:16px;background:#ffffff05}.settings-row{display:flex;align-items:center;justify-content:space-between;gap:15px;padding:13px 0;border-bottom:1px solid var(--line)}.switch{accent-color:var(--accent);width:18px;height:18px}.toast{position:absolute;z-index:2000;bottom:88px;left:50%;transform:translateX(-50%);padding:11px 16px;border:1px solid #ffffff24;background:#202b3b;border-radius:12px;box-shadow:var(--shadow);font-size:13px;max-width:90%;text-align:center}
#mobileMenu{display:none}
@media(max-width:650px){#topbar{height:40px;padding:0 10px}.topright .date{display:none}#icons{top:54px;left:8px;grid-template-columns:repeat(2,76px);gap:3px}.desktop-icon{width:72px;min-height:70px;font-size:11px}.window{left:6px!important;top:46px!important;width:calc(100vw - 12px)!important;height:calc(100% - 92px)!important;min-width:0;border-radius:13px}.window.maximized{left:4px!important;top:44px!important;width:calc(100% - 8px)!important;height:calc(100% - 86px)!important}.titlebar{height:42px}.window-body{padding:12px}.file-layout{grid-template-columns:1fr}.sidebar{display:flex;gap:5px;overflow:auto;border-right:0;border-bottom:1px solid var(--line);padding:7px}.sideitem{white-space:nowrap;width:auto;flex:0 0 auto;padding:8px}.filemain{padding:10px}.filegrid{grid-template-columns:repeat(auto-fill,minmax(82px,1fr));gap:4px}.fileitem{min-height:86px;font-size:11px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}#dock{bottom:7px;gap:4px;padding:6px;border-radius:15px}.dockbtn{width:43px;height:43px;font-size:21px}.window-footer{padding:7px 10px}.browserbar button{padding:8px}.row.mobile-stack{align-items:stretch;flex-direction:column}}
</style>
</head>
<body>
<div id="desktop">
  <header id="topbar"><div class="brand"><span class="logo">P</span><span>Pocket OS</span></div><div class="topright"><span id="status">Local workspace</span><span class="date" id="clock"></span><button class="ghost" style="padding:4px 8px" onclick="openApp('settings')">⚙</button></div></header>
  <div id="icons">
    <button class="desktop-icon" onclick="openApp('files')"><span class="emoji">📁</span><span>Files</span></button>
    <button class="desktop-icon" onclick="openApp('browser')"><span class="emoji">🌐</span><span>Browser</span></button>
    <button class="desktop-icon" onclick="openApp('notes')"><span class="emoji">📝</span><span>Notes</span></button>
    <button class="desktop-icon" onclick="openApp('backup')"><span class="emoji">💾</span><span>Backup</span></button>
    <button class="desktop-icon" onclick="openApp('settings')"><span class="emoji">⚙️</span><span>Settings</span></button>
  </div>
  <main id="windows"></main>
  <nav id="dock" aria-label="App dock">
    <button class="dockbtn" title="Home" onclick="closeAll()">⌂</button>
    <button class="dockbtn" title="Files" onclick="openApp('files')">📁</button>
    <button class="dockbtn" title="Browser" onclick="openApp('browser')">🌐</button>
    <button class="dockbtn" title="Notes" onclick="openApp('notes')">📝</button>
    <button class="dockbtn" title="Backup & Restore" onclick="openApp('backup')">💾</button>
    <button class="dockbtn" title="Settings" onclick="openApp('settings')">⚙️</button>
  </nav>
  <div id="toast" class="toast hidden"></div>
</div>
<input id="uploadInput" type="file" multiple class="hidden">
<input id="restoreInput" type="file" accept=".json,application/json" class="hidden">
<script>
const KEY='pocket-os-data-v1', SETTINGS='pocket-os-settings-v1';
const defaultData={version:1,files:[{id:'root-doc',name:'Welcome.txt',type:'text/plain',parent:'root',content:'Welcome to Pocket OS!\\n\\nThis is your personal browser-based desktop. Create folders, upload files, write notes, and export a backup regularly.\\n\\nYour data is stored locally in this browser on this device.'}],notes:'',createdAt:new Date().toISOString()};
let data=loadData(), settings=JSON.parse(localStorage.getItem(SETTINGS)||'{}'), z=10, activeFolder='root', selectedFiles=new Set(), currentBrowserUrl='', lastWindow=0;
function loadData(){try{return JSON.parse(localStorage.getItem(KEY))||structuredClone(defaultData)}catch(e){return structuredClone(defaultData)}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(data));localStorage.setItem(SETTINGS,JSON.stringify(settings));document.getElementById('status').textContent='Saved locally';return true}catch(e){toast('Storage limit reached. Export a backup and remove large files.');return false}}
function uid(){return 'f-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,8)}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function toast(s){let t=document.getElementById('toast');t.textContent=s;t.classList.remove('hidden');clearTimeout(window._toastTimer);window._toastTimer=setTimeout(()=>t.classList.add('hidden'),2600)}
function closeAll(){document.querySelectorAll('.window').forEach(w=>w.classList.add('hidden'));document.querySelectorAll('.dockbtn').forEach(b=>b.classList.remove('active'))}
function openApp(app){let existing=document.querySelector('.window[data-app="'+app+'"]');if(existing){existing.classList.remove('hidden');existing.style.zIndex=++z;return}let meta={home:['⌂','Home'],files:['📁','File Manager'],browser:['🌐','Web Browser'],notes:['📝','Notes'],backup:['💾','Backup & Restore'],settings:['⚙️','Settings']}[app]||['▦',app];let w=document.createElement('section');w.className='window';w.dataset.app=app;w.style.zIndex=++z;
w.innerHTML=`<div class="titlebar"><div class="window-title"><span>${meta[0]}</span>${meta[1]}</div><div class="window-controls"><button title="Minimize" data-min>—</button><button title="Maximize" data-max>□</button><button title="Close" data-close>×</button></div></div><div class="window-body ${app==='files'?'no-pad':''}">${appContent(app)}</div>${app==='files'?'<div class="window-footer" id="fileFooter">Local files · Stored on this device</div>':''}`;
document.getElementById('windows').appendChild(w);wireWindow(w);if(app==='files')renderFiles(w);if(app==='notes')wireNotes(w);if(app==='browser')wireBrowser(w);if(app==='backup')wireBackup(w);if(app==='settings')wireSettings(w);document.querySelectorAll('.dockbtn').forEach(b=>b.classList.remove('active'));let idx={files:1,browser:2,notes:3,backup:4,settings:5}[app];if(idx!==undefined)document.querySelectorAll('.dockbtn')[idx].classList.add('active')}
function wireWindow(w){w.addEventListener('pointerdown',()=>w.style.zIndex=++z);w.querySelector('[data-close]').onclick=()=>w.remove();w.querySelector('[data-min]').onclick=()=>w.classList.add('hidden');w.querySelector('[data-max]').onclick=()=>w.classList.toggle('maximized');let bar=w.querySelector('.titlebar'),drag=false,sx=0,sy=0,ox=0,oy=0;bar.addEventListener('pointerdown',e=>{if(e.target.closest('button')||window.innerWidth<=650||w.classList.contains('maximized'))return;drag=true;sx=e.clientX;sy=e.clientY;ox=w.offsetLeft;oy=w.offsetTop;bar.setPointerCapture(e.pointerId)});bar.addEventListener('pointermove',e=>{if(!drag)return;w.style.left=Math.max(0,Math.min(window.innerWidth-w.offsetWidth,ox+e.clientX-sx))+'px';w.style.top=Math.max(42,Math.min(window.innerHeight-w.offsetHeight-70,oy+e.clientY-sy))+'px'});bar.addEventListener('pointerup',()=>drag=false)}
function appContent(app){if(app==='home')return `<h2>Welcome home</h2><p class="subhead">Your personal workspace, wherever you are.</p>${homeContent()}`;
if(app==='files')return `<div class="file-layout"><aside class="sidebar"><button class="sideitem selected" data-folder="root">🏠 Home</button><button class="sideitem" data-folder="root">📄 All files</button><button class="sideitem" data-folder="root" data-kind="recent">🕘 Recent</button><button class="sideitem" data-folder="root" data-kind="folders">📁 Folders</button></aside><div class="filemain"><div class="between"><div><h2 style="margin:0">Files</h2><div class="small" id="filePath">Home / All files</div></div><button onclick="openApp('backup')">💾 Backup</button></div><div class="toolbar" style="margin-top:14px"><button onclick="goUpFolder()">↑ Up</button><button onclick="newFolder()">＋ Folder</button><button onclick="newTextFile()">＋ Text file</button><button onclick="document.getElementById('uploadInput').click()">↑ Upload</button><button onclick="downloadSelected()">↓ Download</button><button onclick="deleteSelected()">🗑 Delete</button></div><div class="filegrid" id="fileGrid"></div><div class="small" id="fileCount" style="margin-top:12px"></div></div></div>`;
if(app==='browser')return `<h2>Web Browser</h2><p class="subhead">Search the web or open a website in your device's browser.</p><div class="browserbar"><button id="backBtn" title="Back">←</button><button id="homeBtn" title="Home">⌂</button><input class="field" id="urlInput" placeholder="Search or enter website address"><button class="primary" id="goBtn">Go</button></div><div id="browserView"><div class="browserhome"><div style="font-size:44px">🌐</div><h2 style="margin:12px 0 4px">A little window to the web</h2><p class="muted">Search with DuckDuckGo or open a site in a new tab.</p><div class="search"><input class="field" id="homeSearch" placeholder="Search the web…"><button class="primary" id="searchBtn">Search</button></div><div class="quicklinks"><button data-url="https://duckduckgo.com">DuckDuckGo</button><button data-url="https://wikipedia.org">Wikipedia</button><button data-url="https://github.com">GitHub</button></div></div></div><div class="webnote small" style="margin-top:12px">For safety and compatibility, websites open in a new browser tab. Embedding arbitrary sites inside this window is blocked by many websites.</div>`;
if(app==='notes')return `<h2>Notes</h2><p class="subhead">Autosaves on this device as you type.</p><textarea id="notesText" class="field" style="height:calc(100% - 88px);min-height:220px;resize:vertical" placeholder="Capture an idea…"></textarea><div class="between" style="margin-top:9px"><span class="small" id="notesStatus">Autosave enabled</span><button id="clearNotes">Clear notes</button></div>`;
if(app==='backup')return `<h2>Backup & Restore</h2><p class="subhead">Make a portable copy of your Pocket OS files and notes, or restore a previous backup.</p><div class="grid"><div class="tile"><div class="big">💾</div><strong>Export full backup</strong><p class="small">Download a JSON backup containing your virtual files, folders, notes, and settings.</p><button class="primary" id="exportBtn">Export backup</button></div><div class="tile"><div class="big">♻️</div><strong>Restore backup</strong><p class="small">Import a Pocket OS JSON backup. This replaces the current workspace.</p><button id="restoreBtn">Choose backup</button></div><div class="tile"><div class="big">📦</div><strong>Download all files</strong><p class="small">Download each stored file individually. Useful for moving documents elsewhere.</p><button id="downloadAllBtn">Download files</button></div><div class="tile"><div class="big">🛡️</div><strong>Storage status</strong><p class="small" id="storageInfo">Calculating…</p><button id="refreshStorage">Refresh status</button></div></div><div class="webnote" style="margin-top:16px"><strong>Important</strong><p class="small" style="margin:7px 0 0">This is local browser storage, not cloud sync. Backups are not encrypted. Keep backup files somewhere private, and export them before clearing browser data or switching devices.</p></div>`;
if(app==='settings')return `<h2>Settings</h2><p class="subhead">Tune your Pocket OS workspace.</p><div class="settings-row"><div><strong>Confirm before deleting</strong><div class="small">Ask before deleting files or folders.</div></div><input type="checkbox" class="switch" id="confirmDelete" ${settings.confirmDelete!==false?'checked':''}></div><div class="settings-row"><div><strong>Desktop icon labels</strong><div class="small">Show app names on the desktop.</div></div><input type="checkbox" class="switch" id="showLabels" ${settings.showLabels!==false?'checked':''}></div><div class="settings-row"><div><strong>Workspace storage</strong><div class="small">Files and notes are stored in this browser profile.</div></div><span class="small">Local only</span></div><div class="webnote" style="margin-top:18px"><h3>About Pocket OS</h3><p class="small">A lightweight, installable web desktop designed for phone and computer screens. Includes a desktop, app windows, file manager, web launcher, notes, and backup/restore.</p><p class="small">Version 0.1.0 · GitHub Pages compatible · No account required.</p></div><div class="row" style="margin-top:16px"><button id="exportFromSettings">Export backup</button><button id="resetWorkspace">Reset workspace</button></div>`;
return `<h2>Home</h2>${homeContent()}`}
function homeContent(){return `<p class="subhead">A simple workspace that stays with this browser.</p><div class="grid"><div class="tile"><div class="big">📁</div><strong>File Manager</strong><p class="small">Organize folders, upload files, and download them later.</p><button onclick="openApp('files')">Open Files</button></div><div class="tile"><div class="big">🌐</div><strong>Web Browser</strong><p class="small">Search the web and launch websites.</p><button onclick="openApp('browser')">Open Browser</button></div><div class="tile"><div class="big">📝</div><strong>Notes</strong><p class="small">Quick notes with automatic saving.</p><button onclick="openApp('notes')">Open Notes</button></div><div class="tile"><div class="big">💾</div><strong>Backup & Restore</strong><p class="small">Protect your workspace with a portable backup.</p><button onclick="openApp('backup')">Manage backup</button></div></div><div class="webnote" style="margin-top:15px"><strong>Start here</strong><p class="small" style="margin:7px 0 0">Open apps from the desktop icons or bottom dock. On a phone, windows adapt to fill the screen. Use Backup & Restore to move your workspace to another device.</p></div>`}
function renderFiles(w){let body=w.querySelector('.window-body');body.querySelectorAll('[data-folder]').forEach(b=>b.onclick=()=>{activeFolder=b.dataset.folder||'root';selectedFiles.clear();body.querySelectorAll('.sideitem').forEach(x=>x.classList.toggle('selected',x===b));renderFiles(w,b.dataset.kind)});renderFiles(w)}
function renderFiles(w,kind){if(!w)w=document.querySelector('.window[data-app="files"]');if(!w)return;let grid=w.querySelector('#fileGrid');if(!grid)return;let files=data.files.filter(f=>(f.parent||'root')===activeFolder);if(kind==='folders')files=files.filter(f=>f.kind==='folder');if(kind==='recent')files=files.slice().reverse().slice(0,20);grid.innerHTML='';files.forEach(f=>{let b=document.createElement('button');b.className='fileitem'+(selectedFiles.has(f.id)?' selected':'');b.innerHTML=`<span class="fileemoji">${f.kind==='folder'?'📁':iconFor(f.name,f.type)}</span><span>${esc(f.name)}</span>`;b.onclick=e=>{if(f.kind==='folder'){activeFolder=f.id;selectedFiles.clear();renderFiles(w,kind);return}if(e.detail===2){openFile(f)}else{if(e.ctrlKey||e.metaKey){selectedFiles.has(f.id)?selectedFiles.delete(f.id):selectedFiles.add(f.id)}else{selectedFiles.clear();selectedFiles.add(f.id)}renderFiles(w,kind)}};grid.appendChild(b)});w.querySelector('#filePath').textContent='Home / '+(activeFolder==='root'?'All files':(data.files.find(f=>f.id===activeFolder)?.name||'Folder'));w.querySelector('#fileCount').textContent=`${files.length} item${files.length===1?'':'s'} · Tap a folder to open it; select files to download or delete.`;let footer=w.querySelector('#fileFooter');if(footer)footer.textContent=`${data.files.length} total items · ${selectedFiles.size} selected · Stored locally`}
function iconFor(name,type){if(type&&type.startsWith('image/'))return '🖼️';if(type&&type.startsWith('audio/'))return '🎵';if(type&&type.startsWith('video/'))return '🎬';let ext=(name.split('.').pop()||'').toLowerCase();return ({pdf:'📕',doc:'📘',docx:'📘',txt:'📄',md:'📄',json:'🧩',zip:'🗜️',png:'🖼️',jpg:'🖼️',jpeg:'🖼️',gif:'🖼️',mp3:'🎵',mp4:'🎬',csv:'📊',xls:'📊',xlsx:'📊'})[ext]||'📄'}
function goUpFolder(){if(activeFolder==='root')return;let f=data.files.find(x=>x.id===activeFolder);activeFolder=f?(f.parent||'root'):'root';selectedFiles.clear();renderFiles()}\nfunction newFolder(){let name=prompt('Folder name:');if(!name||!name.trim())return;data.files.push({id:uid(),name:name.trim(),type:'inode/directory',kind:'folder',parent:activeFolder});save();renderFiles()}
function newTextFile(){let name=prompt('Text file name:','New document.txt');if(!name||!name.trim())return;let content=prompt('Initial text (optional):','')||'';data.files.push({id:uid(),name:name.trim(),type:'text/plain',kind:'file',parent:activeFolder,content});save();renderFiles()}
function openFile(f){if(f.kind==='folder'){activeFolder=f.id;renderFiles();return}if(f.content!==undefined&&String(f.type||'').startsWith('text/')){let updated=prompt('Edit '+f.name+' (changes save locally):',f.content);if(updated!==null){f.content=updated;save();renderFiles()}return}if(f.dataUrl){let a=document.createElement('a');a.href=f.dataUrl;a.target='_blank';a.rel='noopener';a.click()}else toast('This file is stored as metadata only. Download it from a browser session where it was uploaded.')}
function downloadFile(f){let blob;if(f.dataUrl){let a=document.createElement('a');a.href=f.dataUrl;a.download=f.name;a.click();return}blob=new Blob([f.content||''],{type:f.type||'application/octet-stream'});let url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=f.name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function downloadSelected(){let fs=data.files.filter(f=>selectedFiles.has(f.id)&&f.kind!=='folder');if(!fs.length){toast('Select a file first.');return}fs.forEach((f,i)=>setTimeout(()=>downloadFile(f),i*250))}
function deleteSelected(){let fs=data.files.filter(f=>selectedFiles.has(f.id));if(!fs.length){toast('Select items first.');return}if(settings.confirmDelete!==false&&!confirm(`Delete ${fs.length} selected item(s)?`))return;let ids=new Set(fs.map(f=>f.id));let changed=true;while(changed){changed=false;data.files.forEach(f=>{if(ids.has(f.parent)&&!ids.has(f.id)){ids.add(f.id);changed=true}})}data.files=data.files.filter(f=>!ids.has(f.id));selectedFiles.clear();save();renderFiles()}
document.getElementById('uploadInput').addEventListener('change',async e=>{let files=[...e.target.files];for(let f of files){let dataUrl=await readAsDataURL(f);data.files.push({id:uid(),name:f.name,type:f.type||'application/octet-stream',kind:'file',parent:activeFolder,size:f.size,dataUrl})}save();renderFiles();e.target.value='';toast(`${files.length} file(s) added`)});
function readAsDataURL(f){return new Promise((res,rej)=>{let r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(f)})}
function wireNotes(w){let ta=w.querySelector('#notesText');ta.value=data.notes||'';let timer;ta.addEventListener('input',()=>{data.notes=ta.value;w.querySelector('#notesStatus').textContent='Saving…';clearTimeout(timer);timer=setTimeout(()=>{save();w.querySelector('#notesStatus').textContent='Saved locally'},250)});w.querySelector('#clearNotes').onclick=()=>{if(confirm('Clear all notes?')){ta.value='';data.notes='';save();toast('Notes cleared')}}}
function wireBrowser(w){let input=w.querySelector('#urlInput');function go(v){v=(v||input.value||'').trim();if(!v)return;let url;if(/^https?:\/\//i.test(v))url=v;else if(v.includes('.')&&!v.includes(' '))url='https://'+v;else url='https://duckduckgo.com/?q='+encodeURIComponent(v);currentBrowserUrl=url;input.value=url;w.querySelector('#browserView').innerHTML=`<div class="browserhome"><div style="font-size:40px">↗️</div><h2>Opening in a new tab</h2><p class="muted">${esc(url)}</p><button class="primary" id="openAgain">Open website</button><p class="small">The site opened outside Pocket OS because many websites block embedding.</p></div>`;w.querySelector('#openAgain').onclick=()=>window.open(url,'_blank','noopener');window.open(url,'_blank','noopener')}w.querySelector('#goBtn').onclick=()=>go(input.value);input.addEventListener('keydown',e=>{if(e.key==='Enter')go(input.value)});w.querySelector('#homeSearch').addEventListener('keydown',e=>{if(e.key==='Enter')go(w.querySelector('#homeSearch').value)});w.querySelector('#searchBtn').onclick=()=>go(w.querySelector('#homeSearch').value);w.querySelector('#backBtn').onclick=()=>{if(currentBrowserUrl)window.open(currentBrowserUrl,'_blank','noopener');else toast('No previous page in this window.')};w.querySelector('#homeBtn').onclick=()=>{input.value='';w.querySelector('#browserView').innerHTML=`<div class="browserhome"><div style="font-size:44px">🌐</div><h2>A little window to the web</h2><p class="muted">Search the web or open a site.</p></div>`};w.querySelectorAll('[data-url]').forEach(b=>b.onclick=()=>go(b.dataset.url))}
function backupObject(){return {app:'Pocket OS',backupVersion:1,exportedAt:new Date().toISOString(),data,settings}}
function exportBackup(){let blob=new Blob([JSON.stringify(backupObject(),null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='pocket-os-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('Backup exported')}
function wireBackup(w){w.querySelector('#exportBtn').onclick=exportBackup;w.querySelector('#restoreBtn').onclick=()=>document.getElementById('restoreInput').click();w.querySelector('#downloadAllBtn').onclick=()=>{let fs=data.files.filter(f=>f.kind!=='folder');if(!fs.length){toast('No files to download');return}fs.forEach((f,i)=>setTimeout(()=>downloadFile(f),i*300))};let update=()=>{let bytes=new Blob([JSON.stringify(data)]).size;w.querySelector('#storageInfo').textContent=`About ${(bytes/1024).toFixed(1)} KB of workspace data (browser quota varies).`};update();w.querySelector('#refreshStorage').onclick=update}
document.getElementById('restoreInput').addEventListener('change',async e=>{let f=e.target.files[0];if(!f)return;try{let obj=JSON.parse(await f.text());if(obj.app!=='Pocket OS'||!obj.data||!Array.isArray(obj.data.files))throw new Error('That file is not a Pocket OS backup.');if(!confirm('Restore this backup? Your current workspace will be replaced.'))return;data=obj.data;settings=obj.settings||{};save();document.querySelectorAll('.window').forEach(w=>w.remove());toast('Backup restored successfully')}catch(err){alert('Could not restore backup: '+err.message)}finally{e.target.value=''}});
function wireSettings(w){w.querySelector('#confirmDelete').onchange=e=>{settings.confirmDelete=e.target.checked;save()};w.querySelector('#showLabels').onchange=e=>{settings.showLabels=e.target.checked;document.getElementById('icons').style.opacity=e.target.checked?'1':'.8';save()};w.querySelector('#exportFromSettings').onclick=exportBackup;w.querySelector('#resetWorkspace').onclick=()=>{if(confirm('Reset Pocket OS to a fresh workspace? Export a backup first if you need your files.')){data=structuredClone(defaultData);save();document.querySelectorAll('.window').forEach(x=>x.remove());toast('Workspace reset')}}}
function updateClock(){let d=new Date();document.getElementById('clock').textContent=d.toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'})+' · '+d.toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit'})}updateClock();setInterval(updateClock,30000);
if('serviceWorker' in navigator && location.protocol.startsWith('http'))window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
openApp('home');
</script>
</body>
</html>
